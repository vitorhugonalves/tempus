# Bandit: análise estática de segurança do backend Python.
# Os resultados aparecem em Security → Code scanning do repositório.
#
# Roda o bandit direto (sem action de terceiros) para usar a mesma configuração do
# ambiente local: [tool.bandit] em backend/pyproject.toml exclui tests e migrations.
# Equivalente local, dentro de backend/: bandit -c pyproject.toml -r app

name: Bandit
on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '44 17 * * 0'

jobs:
  bandit:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar bandit
        run: pip install "bandit[sarif,toml]>=1.9.4,<2"

      # --exit-zero: os achados vão para a aba Security em vez de falhar o job
      - name: Bandit Scan
        run: bandit -c pyproject.toml -r app -f sarif -o bandit.sarif --exit-zero

      - name: Enviar resultados para o GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: backend/bandit.sarif
          category: bandit
