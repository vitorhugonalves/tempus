[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tempus"
version = "0.1.0"
description = "Gerenciador de timers online para competições esportivas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # [asyncio] traz o greenlet (opcional a partir da 2.1); <2.1 mantém a série testada.
    "sqlalchemy[asyncio]>=2.0.0,<2.1",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.14.2",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.31",
    "httpx>=0.27.0",
    "aiosmtplib>=5.1.2",
    "weasyprint>=70.0",
    "Pillow>=12.3.0",
    "slowapi>=0.1.9",
    "redis[hiredis]>=5.0.0",
    # Pisos de segurança de dependências transitivas (pip-audit, 2026-10-20).
    # Não são usadas direto pelo app; só impedem o resolver de escolher versão vulnerável.
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "idna>=3.15",
    "mako>=1.3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "fakeredis>=2.23.0",
    "pygments>=2.20.0",
    "bandit[toml]>=1.9.4,<2",
    "pip-audit>=2.7,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.bandit]
# Testes usam assert (B101) por natureza; migrations são geradas pelo Alembic.
exclude_dirs = ["tests", "app/db/migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/db/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
