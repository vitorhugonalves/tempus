services:
  postgres:
    image: postgres:16-alpine
    container_name: tempus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tempus}
      POSTGRES_USER: ${POSTGRES_USER:-tempus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - tempus-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tempus} -d ${POSTGRES_DB:-tempus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tempus-redis
    restart: unless-stopped
    # AOF (appendonly) garante durabilidade por operação;
    # save 60 1 adiciona snapshots RDB a cada 60s como camada extra de recuperação.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - tempus-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: tempus-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tempus}:${POSTGRES_PASSWORD}@tempus-postgres:5432/${POSTGRES_DB:-tempus}
      - REDIS_URL=redis://tempus-redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: tempus-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  tempus-postgres:
    driver: local
  tempus-redis:
    driver: local
